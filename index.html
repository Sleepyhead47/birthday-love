<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🤍</title>

<style>
:root{
  --bg1:#ff758c;--bg2:#ffb3c6;
  --card:rgba(255,255,255,.96);
  --text:#444;
}
body.night{
  --bg1:#0f2027;--bg2:#203a43;
  --card:rgba(20,20,30,.96);
  --text:#eee;
}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
  transition:.6s;
  overflow:hidden;
}

.card{
  position:relative;
  width:92%;
  max-width:420px;
  background:var(--card);
  padding:30px;
  border-radius:26px;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
}

img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ff4d6d;
  margin-bottom:12px;
}

h1{color:#ff4d6d;margin:6px 0}
h2{color:var(--text);font-weight:500;margin-bottom:14px}

p{
  color:var(--text);
  line-height:1.7;
  min-height:90px;
  font-size:1.05rem;
}

footer{
  margin-top:18px;
  color:var(--text);
  font-size:.95rem;
}

button{
  margin-top:14px;
  padding:10px 18px;
  border:none;
  border-radius:20px;
  background:#ff4d6d;
  color:#fff;
  cursor:pointer;
}

.toggle{
  position:absolute;
  top:14px;
  right:16px;
  font-size:1.3rem;
  cursor:pointer;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:50;
}
.popup div{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  max-width:300px;
}
.popup h1{color:#ff4d6d}
</style>
</head>

<body>

<div class="card">
  <div class="toggle" onclick="toggleNight()">🌙</div>

  <img src="photo.jpg" alt="Photo">

  <h1>Happy Birthday, <span id="name"></span> 🤍</h1>
  <h2>You turn <span id="age"></span> today ✨</h2>

  <p id="message"></p>

  <footer>— Always yours, <span id="from"></span></footer>

  <button onclick="playMusic()">🎵 Play Music</button>
</div>

<div class="popup" id="popup">
  <div>
    <h1>I love you 🤍</h1>
    <p>
      I love you the most. I wanna spend the rest of your birthdays with you.
      Time is tough, but you are my home and I am yours.
      Happy birthday again, the prettiest in the world 🤍
    </p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* ✨ EDIT THIS PART ✨ */
const data={
  name:"nidhi",
  age:19,
  message:"You are my home, my favorite thought, and my forever choice. I hope this birthday makes you feel as special as you truly are 🤍",
  from:"Ayan"
};

/* Fill text safely */
document.getElementById("name").textContent = data.name;
document.getElementById("age").textContent = data.age;
document.getElementById("from").textContent = data.from;

/* Typewriter effect */
let i = 0;
const messageEl = document.getElementById("message");
(function type(){
  if(i < data.message.length){
    messageEl.textContent += data.message[i++];
    setTimeout(type, 40);
  }
})();

/* 🔓 OPEN IMMEDIATELY */
setTimeout(()=>{
  document.getElementById("popup").style.display="flex";
},2500);

/* Music */
function playMusic(){
  document.getElementById("music").play();
}

/* Night mode */
function toggleNight(){
  document.body.classList.toggle("night");
}

/* Close popup */
function closePopup(){
  document.getElementById("popup").style.display="none";
}

</script>
</body>
</html>
